<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المتجر العصري الفاخر | الصفحة الرئيسية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #12100e; color: #f3f4f6; }
        .gold-glow { text-shadow: 0 0 20px rgba(212, 175, 55, 0.5); }
        .glass-card { background: rgba(26, 22, 18, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(212, 175, 55, 0.3); }
        .amber-gradient { background: linear-gradient(135deg, #d4af37 0%, #b8860b 100%); }
        .cat-float { animation: float 4s ease-in-out infinite; }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- شريط التنقل العلوي -->
    <header class="glass-card sticky top-0 z-50 py-4 px-6 flex justify-between items-center shadow-2xl border-b border-amber-900/30">
        <div class="flex items-center gap-3">
            <span class="text-2xl font-black text-amber-400 gold-glow tracking-wider">🐱 SWEETY STORE</span>
        </div>
        <div class="flex gap-4 items-center">
            <div id="liveClock" class="text-xs text-amber-300 font-mono bg-neutral-900/80 px-3 py-1.5 rounded-xl border border-amber-900/40"></div>
            <a href="admin.html" target="_blank" class="text-xs amber-gradient text-black font-extrabold px-4 py-2.5 rounded-xl shadow-lg hover:opacity-90 transition">دخول الأدمن 🔒</a>
        </div>
    </header>

    <!-- القسم الرئيسي مع القطة والأزياء -->
    <section class="container mx-auto px-4 py-8 flex flex-col items-center text-center">
        <div class="relative mb-6">
            <div class="absolute -inset-1 rounded-3xl amber-gradient opacity-30 blur-xl"></div>
            <div class="relative glass-card p-4 rounded-3xl max-w-sm mx-auto cat-float shadow-2xl">
                <!-- صورة القطة من الفيديو الأصلي -->
                <img src="https://images.unsplash.com/photo-1543852786-1cf6624b9987?auto=format&fit=crop&w=600&q=80" alt="القطة الأنيقة" class="w-full h-72 object-cover rounded-2xl border border-amber-500/30">
                <div class="mt-4 text-right">
                    <span class="text-xs text-amber-400 font-bold">✨ القط المسؤول عن الأناقة</span>
                    <h2 class="text-lg font-black text-white">أهلاً بك، نحن معك هنا لتألق دائري!</h2>
                </div>
            </div>
        </div>

        <!-- الأقسام الرئيسية للمتجر -->
        <div class="flex justify-center gap-3 mb-10 flex-wrap w-full">
            <button onclick="filterCategory('all')" class="cat-btn active px-6 py-2.5 rounded-full amber-gradient text-black font-extrabold transition shadow-lg">الكل</button>
            <button onclick="filterCategory('men')" class="cat-btn px-6 py-2.5 rounded-full bg-neutral-900/80 border border-amber-900/30 text-amber-200 hover:bg-amber-950/40 transition">رجالي 👔</button>
            <button onclick="filterCategory('women')" class="cat-btn px-6 py-2.5 rounded-full bg-neutral-900/80 border border-amber-900/30 text-amber-200 hover:bg-amber-950/40 transition">نسائي 👗</button>
            <button onclick="filterCategory('kids')" class="cat-btn px-6 py-2.5 rounded-full bg-neutral-900/80 border border-amber-900/30 text-amber-200 hover:bg-amber-950/40 transition">أطفالي 🧸</button>
        </div>
    </section>

    <!-- شبكة المنتجات -->
    <main class="flex-grow container mx-auto px-4 py-4">
        <h3 class="text-xl font-bold text-amber-400 mb-6 border-r-4 border-amber-500 pr-3">منتجات وعروض المتجر الحالية</h3>
        <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- المنتجات تظهر هنا فورياً -->
        </div>
    </main>

    <footer class="text-center py-6 text-amber-500/50 text-sm border-t border-amber-900/20 mt-12">
        جميع الحقوق محفوظة © المتجر الفاخر 2026
    </footer>

    <script>
        // تحديث الوقت الحي مثل الفيديو
        setInterval(() => {
            const now = new Date();
            document.getElementById('liveClock').innerText = `🕒 ${now.toLocaleTimeString('en-US')}`;
        }, 1000);

        function loadProducts() {
            const products = JSON.parse(localStorage.getItem('cloud_products') || '[]');
            renderProducts(products);
        }

        function renderProducts(products, filter = 'all') {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            
            const filtered = filter === 'all' ? products : products.filter(p => p.category === filter);

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-16 text-amber-500/60 font-semibold glass-card rounded-2xl">لا توجد منتجات مضافة في هذا القسم حالياً... أضف أول منتج عبر لوحة التحكم!</div>`;
                return;
            }

            filtered.forEach(p => {
                grid.innerHTML += `
                    <div class="glass-card rounded-2xl overflow-hidden shadow-2xl hover:scale-[1.02] transition duration-300 flex flex-col">
                        <img src="${p.image}" alt="${p.name}" class="w-full h-60 object-cover bg-neutral-950" onerror="this.src='https://via.placeholder.com/300?text=No+Image'">
                        <div class="p-5 flex flex-col flex-grow justify-between">
                            <div>
                                <span class="text-xs text-amber-400/80 font-bold uppercase tracking-wider">${p.category}</span>
                                <h3 class="text-lg font-bold text-white mt-1">${p.name}</h3>
                                <p class="text-neutral-400 text-sm mt-1 line-clamp-2">${p.desc}</p>
                            </div>
                            <div class="flex justify-between items-center mt-5 pt-4 border-t border-amber-900/20">
                                <span class="text-xl font-black text-amber-300">${p.price} ر.س</span>
                                <button onclick="alert('تمت الإضافة للسلة بنجاح!')" class="amber-gradient text-black font-extrabold px-4 py-2 rounded-xl text-xs hover:opacity-90 transition shadow-md">شراء الآن</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function filterCategory(cat) {
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('amber-gradient', 'text-black', 'font-extrabold', 'shadow-lg');
                btn.classList.add('bg-neutral-900/80', 'border', 'border-amber-900/30', 'text-amber-200');
            });
            event.target.classList.remove('bg-neutral-900/80', 'border', 'border-amber-900/30', 'text-amber-200');
            event.target.classList.add('amber-gradient', 'text-black', 'font-extrabold', 'shadow-lg');

            const products = JSON.parse(localStorage.getItem('cloud_products') || '[]');
            renderProducts(products, cat);
        }

        window.addEventListener('storage', loadProducts);
        window.onload = loadProducts;
    </script>
</body>
</html>
