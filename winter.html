<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تشكيلة الشتاء - كيان جينز</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <style>
        :root { --bg-color: #f8f9fa; --panel-bg: #ffffff; --accent-color: #c5a059; --text-color: #1a1a1a; --secondary-text: #666666; --border-color: #e5e7eb; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); line-height: 1.6; }
        header { background-color: var(--panel-bg); padding: 18px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); }
        .logo { font-size: 22px; font-weight: bold; color: var(--accent-color); }
        nav a { color: var(--secondary-text); text-decoration: none; margin-left: 15px; font-size: 14px; font-weight: 600; }
        .hero { padding: 40px 20px; text-align: center; background: #fff; border-bottom: 1px solid var(--border-color); }
        .hero h1 { font-size: 26px; color: var(--accent-color); margin-bottom: 10px; }
        .section-container { max-width: 1200px; margin: 40px auto; padding: 0 15px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
        .product-card { background-color: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.04); }
        .product-img-container { width: 100%; height: 210px; background-color: #eee; }
        .product-img { width: 100%; height: 100%; object-fit: cover; }
        .product-info { padding: 15px; }
        .product-id { font-size: 12px; color: #888; margin-bottom: 4px; }
        .product-name { font-size: 18px; margin-bottom: 6px; font-weight: bold; }
        .product-price { color: var(--accent-color); font-size: 17px; font-weight: bold; margin-bottom: 12px; }
        .buy-btn { display: block; width: 100%; padding: 11px; background-color: var(--accent-color); color: #fff; text-align: center; border-radius: 6px; text-decoration: none; font-weight: bold; }
        footer { text-align: center; padding: 30px; background-color: var(--panel-bg); color: var(--secondary-text); border-top: 1px solid var(--border-color); margin-top: 40px; }
    </style>
</head>
<body>
    <header>
        <div class="logo">كيان جينز - شتوي</div>
        <nav><a href="index.html">الرئيسية</a><a href="summer.html">صيفي</a><a href="winter.html" style="color: var(--accent-color);">شتوي</a></nav>
    </header>
    <section class="hero">
        <h1>تشكيلة الشتاء الفاخرة</h1>
        <p>جواكت وسويتشيرتات شتوية راقية تمنحك الدفء والفخامة.</p>
    </section>
    <div class="section-container">
        <div class="products-grid" id="winter-grid"></div>
    </div>
    <footer>جميع الحقوق محفوظة © كيان جينز 2026</footer>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD0zBcQyBgL580vQT6NB0Bo03nm84ncXg",
            authDomain: "fashionstore-f92b6.firebaseapp.com",
            projectId: "fashionstore-f92b6",
            storageBucket: "fashionstore-f92b6.appspot.com",
            messagingSenderId: "787445522859",
            appId: "1:787445522859:web:35839055f2eb83862472ee",
            measurementId: "G-E8J7DDK1DL"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        db.collection("products").where("category", "==", "winter").get().then(snapshot => {
            const grid = document.getElementById('winter-grid');
            grid.innerHTML = '';
            snapshot.forEach(doc => {
                const p = doc.data();
                const img = (p.imgs && p.imgs[0]) ? p.imgs[0] : '1000843025.png';
                grid.innerHTML += `
                    <div class="product-card">
                        <div class="product-img-container"><img src="${img}" class="product-img"></div>
                        <div class="product-info">
                            <div class="product-id">كود المنتج: ${p.id}</div>
                            <div class="product-name">${p.name}</div>
                            <div class="product-price">${p.price} ج.م</div>
                            <a href="https://wa.me/?text=أود طلب المنتج رقم (${p.id}): ${encodeURIComponent(p.name)} بسعر ${p.price} ج.م" target="_blank" class="buy-btn">اطلب عبر واتساب</a>
                        </div>
                    </div>
                `;
            });
        });
    </script>
</body>
</html>
