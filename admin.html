<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم السحابية | المتجر الرجالي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #12100e; color: #f3f4f6; }
        .glass-card { background: rgba(26, 22, 18, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(212, 175, 55, 0.3); }
        .amber-gradient { background: linear-gradient(135deg, #d4af37 0%, #b8860b 100%); }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex justify-center">

    <div id="loginModal" class="glass-card p-8 rounded-3xl w-full max-w-md shadow-2xl text-center self-center">
        <h2 class="text-2xl font-black text-amber-400 mb-2">تسجيل دخول الأدمن العالمي 🔐</h2>
        <p class="text-neutral-400 text-sm mb-6">كلمة المرور الافتراضية: 1234</p>
        <input type="password" id="adminPass" placeholder="كلمة المرور" class="w-full bg-neutral-950 border border-amber-900/40 rounded-xl px-4 py-3 text-white mb-4 text-center text-lg tracking-widest focus:outline-none focus:border-amber-500">
        <button onclick="checkLogin()" class="w-full amber-gradient text-black font-extrabold py-3 rounded-xl transition shadow-xl hover:opacity-90">دخول لوحة التحكم</button>
        <div class="mt-4"><a href="index.html" class="text-sm text-neutral-500 hover:text-amber-400">← العودة للموقع</a></div>
    </div>

    <div id="adminPanel" class="hidden w-full max-w-5xl glass-card p-6 md:p-8 rounded-3xl shadow-2xl space-y-8">
        <div class="flex justify-between items-center pb-4 border-b border-amber-900/30">
            <h1 class="text-2xl font-black text-amber-400">⚡ لوحة التحكم السحابية المباشرة (تحديث فوري لكل الدول)</h1>
            <div class="flex gap-3">
                <a href="index.html" target="_blank" class="bg-amber-500/10 text-amber-300 border border-amber-500/30 px-4 py-2 rounded-xl text-sm font-semibold">عرض الموقع ↗</a>
                <button onclick="logout()" class="bg-red-500/10 text-red-400 border border-red-500/30 px-4 py-2 rounded-xl text-sm font-semibold">خروج</button>
            </div>
        </div>

        <div class="bg-neutral-950/60 p-6 rounded-2xl border border-amber-900/30">
            <h3 class="text-lg font-bold text-amber-400 mb-4">📦 إضافة منتج رجالي جديد (مع ضغط ذكي للصور وتحديث لحظي)</h3>
            <form id="productForm" onsubmit="addProduct(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm text-neutral-400 mb-1">اسم المنتج</label>
                    <input type="text" id="pName" required placeholder="مثال: بدلة كلاسيكية فاخرة" class="w-full bg-neutral-900 border border-amber-900/40 rounded-xl px-4 py-2.5 text-white">
                </div>
                <div>
                    <label class="block text-sm text-neutral-400 mb-1">القسم الرجالي</label>
                    <select id="pCategory" class="w-full bg-neutral-900 border border-amber-900/40 rounded-xl px-4 py-2.5 text-white">
                        <option value="classic">🧥 بدلات وكلاسيك</option>
                        <option value="pants">👖 بناطيل</option>
                        <option value="shoes">👟 كوتشيات وأحذية</option>
                    </select>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm text-neutral-400 mb-1">اختر صور المنتج من جهازك (موبايل أو لابتوب):</label>
                    <input type="file" id="pImageFiles" multiple accept="image/*" required class="w-full bg-neutral-900 border border-amber-900/40 rounded-xl p-2.5 text-white file:bg-amber-500 file:text-black file:border-0 file:rounded-lg file:px-4 file:py-1 file:font-bold cursor-pointer">
                    <p class="text-xs text-amber-400/70 mt-1">✨ يتم ضغط جودة الصور تلقائياً لتعمل بسرعة صفرية بدون أي تهنيج.</p>
                </div>
                <div>
                    <label class="block text-sm text-neutral-400 mb-1">السعر (ر.س)</label>
                    <input type="number" id="pPrice" placeholder="350" class="w-full bg-neutral-900 border border-amber-900/40 rounded-xl px-4 py-2.5 text-white">
                </div>
                <div class="flex items-center gap-3 pt-6">
                    <input type="checkbox" id="showPriceCheck" checked class="w-5 h-5 accent-amber-500">
                    <label for="showPriceCheck" class="text-sm text-white">إظهار السعر</label>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm text-neutral-400 mb-1">وصف المنتج</label>
                    <textarea id="pDesc" rows="2" placeholder="تفاصيل المقاسات والخامات..." class="w-full bg-neutral-900 border border-amber-900/40 rounded-xl px-4 py-2.5 text-white"></textarea>
                </div>
                <div class="md:col-span-2">
                    <button type="submit" id="submitBtn" class="w-full amber-gradient text-black font-extrabold py-3 rounded-xl shadow-xl hover:opacity-90 transition">نشر سحابياً لكل هواتف العالم وفي نفس الثانية 🚀</button>
                </div>
            </form>
        </div>

        <h3 class="text-lg font-bold text-white mb-2">إدارة وحذف المنتجات الحالية:</h3>
        <div id="adminProductsList" class="space-y-3 max-h-60 overflow-y-auto pr-2"></div>
    </div>

    <script>
        // إعدادات مشروعك السحابي الرسمي (fashionstore-f92b6)
        const firebaseConfig = {
            apiKey: "AIzaSyD0zBcQYBgL580vQT6NB0Bo03nm84ncXg",
            authDomain: "fashionstore-f92b6.firebaseapp.com",
            projectId: "fashionstore-f92b6",
            storageBucket: "fashionstore-f92b6.appspot.com",
            messagingSenderId: "787445522859",
            appId: "1:787445522859:web:79f508718ed066632472ee"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function checkLogin() {
            if (document.getElementById('adminPass').value === '1234') {
                localStorage.setItem('is_admin_logged', 'true');
                showPanel();
            } else { alert('كلمة المرور خطأ!'); }
        }
        function showPanel() {
            document.getElementById('loginModal').classList.add('hidden');
            document.getElementById('adminPanel').classList.remove('hidden');
            loadAdminProducts();
        }
        function logout() { localStorage.removeItem('is_admin_logged'); location.reload(); }
        if (localStorage.getItem('is_admin_logged') === 'true') { showPanel(); }

        function compressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        let width = img.width, height = img.height;
                        const maxDim = 800;
                        if (width > height && width > maxDim) { height *= maxDim / width; width = maxDim; }
                        else if (height > maxDim) { width *= maxDim / height; height = maxDim; }
                        canvas.width = width; canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        async function addProduct(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = "جاري معالجة الصور والنشر السحابي العالمي...";
            btn.disabled = true;

            const fileInput = document.getElementById('pImageFiles');
            const files = fileInput.files;
            const compressedImages = [];
            for (let i = 0; i < files.length; i++) {
                compressedImages.push(await compressImage(files[i]));
            }

            const productId = Date.now().toString();
            const newProduct = {
                id: productId,
                name: document.getElementById('pName').value,
                category: document.getElementById('pCategory').value,
                images: compressedImages,
                price: document.getElementById('pPrice').value,
                showPrice: document.getElementById('showPriceCheck').checked,
                desc: document.getElementById('pDesc').value,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            await db.collection("products").doc(productId).set(newProduct);
            document.getElementById('productForm').reset();
            loadAdminProducts();
            alert('تم النشر السحابي وظهر المنتج في جميع هواتف العالم في نفس الثانية!');
            btn.innerText = "نشر سحابياً لكل هواتف العالم وفي نفس الثانية 🚀";
            btn.disabled = false;
        }

        async function deleteProduct(id) {
            await db.collection("products").doc(id).delete();
            loadAdminProducts();
        }

        function loadAdminProducts() {
            const list = document.getElementById('adminProductsList');
            db.collection("products").orderBy("createdAt", "desc").get().then((snapshot) => {
                list.innerHTML = '';
                snapshot.forEach((doc) => {
                    const p = doc.data();
                    list.innerHTML += `
                        <div class="bg-neutral-900 border border-amber-900/30 p-4 rounded-xl flex justify-between items-center">
                            <div class="flex items-center gap-3">
                                <img src="${p.images && p.images[0] ? p.images[0] : ''}" class="w-12 h-12 rounded-lg object-cover">
                                <div>
                                    <h4 class="font-bold text-white text-sm">${p.name}</h4>
                                    <span class="text-xs text-amber-400">${p.category} | ${p.price || ''} ر.س</span>
                                </div>
                            </div>
                            <button onclick="deleteProduct('${p.id}')" class="bg-red-500/10 text-red-400 px-3 py-1.5 rounded-lg text-xs hover:bg-red-600 transition">حذف</button>
                        </div>
                    `;
                });
            });
        }
    </script>
</body>
</html>
