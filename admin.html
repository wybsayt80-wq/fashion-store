<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الأدمن | المتجر الفاخر</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #12100e; color: #f3f4f6; }
        .glass-card { background: rgba(26, 22, 18, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(212, 175, 55, 0.3); }
        .amber-gradient { background: linear-gradient(135deg, #d4af37 0%, #b8860b 100%); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- نافذة تسجيل الدخول -->
    <div id="loginModal" class="glass-card p-8 rounded-3xl w-full max-w-md shadow-2xl text-center">
        <h2 class="text-2xl font-black text-amber-400 mb-2">تسجيل دخول الأدمن 🔐</h2>
        <p class="text-neutral-400 text-sm mb-6">أدخل كلمة المرور للوصول (الافتراضية: 1234)</p>
        <input type="password" id="adminPass" placeholder="كلمة المرور" class="w-full bg-neutral-950 border border-amber-900/40 rounded-xl px-4 py-3 text-white mb-4 focus:outline-none focus:border-amber-500 text-center text-lg tracking-widest">
        <button onclick="checkLogin()" class="w-full amber-gradient text-black font-extrabold py-3 rounded-xl transition shadow-xl hover:opacity-90">دخول لوحة التحكم</button>
        <div class="mt-4"><a href="index.html" class="text-sm text-neutral-500 hover:text-amber-400 transition">← العودة للموقع الرئيسي</a></div>
    </div>

    <!-- لوحة التحكم الفعلية -->
    <div id="adminPanel" class="hidden w-full max-w-4xl glass-card p-6 md:p-8 rounded-3xl shadow-2xl">
        <div class="flex justify-between items-center mb-6 pb-4 border-b border-amber-900/30">
            <h1 class="text-xl font-bold text-amber-400">⚡ لوحة إدارة المنتجات والإعلانات</h1>
            <div class="flex gap-3">
                <a href="index.html" target="_blank" class="bg-amber-500/10 text-amber-300 border border-amber-500/30 px-4 py-2 rounded-xl text-sm font-semibold hover:bg-amber-500 hover:text-black transition">عرض الموقع ↗</a>
                <button onclick="logout()" class="bg-red-500/10 text-red-400 border border-red-500/30 px-4 py-2 rounded-xl text-sm font-semibold hover:bg-red-600 hover:text-white transition">خروج</button>
            </div>
        </div>

        <!-- نموذج إضافة منتج -->
        <form id="productForm" onsubmit="addProduct(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
            <div>
                <label class="block text-sm text-neutral-400 mb-1">اسم المنتج أو الإعلان</label>
                <input type="text" id="pName" required placeholder="مثال: بدلة كلاسيكية فاخرة" class="w-full bg-neutral-950 border border-amber-900/40 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-amber-500">
            </div>
            <div>
                <label class="block text-sm text-neutral-400 mb-1">السعر (ر.س)</label>
                <input type="number" id="pPrice" required placeholder="250" class="w-full bg-neutral-950 border border-amber-900/40 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-amber-500">
            </div>
            <div>
                <label class="block text-sm text-neutral-400 mb-1">القسم الأساسي</label>
                <select id="pCategory" class="w-full bg-neutral-950 border border-amber-900/40 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-amber-500">
                    <option value="men">رجالي 👔</option>
                    <option value="women">نسائي 👗</option>
                    <option value="kids">أطفالي 🧸</option>
                </select>
            </div>
            <div>
                <label class="block text-sm text-neutral-400 mb-1">رابط الصورة (جودة عالية)</label>
                <input type="url" id="pImage" required placeholder="https://example.com/image.jpg" class="w-full bg-neutral-950 border border-amber-900/40 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-amber-500">
            </div>
            <div class="md:col-span-2">
                <label class="block text-sm text-neutral-400 mb-1">وصف موجز</label>
                <textarea id="pDesc" rows="2" placeholder="تفاصيل سريعة عن المنتج..." class="w-full bg-neutral-950 border border-amber-900/40 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-amber-500"></textarea>
            </div>
            <div class="md:col-span-2">
                <button type="submit" class="w-full amber-gradient text-black font-extrabold py-3 rounded-xl transition shadow-xl hover:opacity-90">نشر المنتج فوراً في الصفحة الرئيسية 🚀</button>
            </div>
        </form>

        <!-- قائمة المنتجات المحفوظة -->
        <h3 class="text-lg font-bold text-white mb-4">المنتجات الحالية في النظام:</h3>
        <div id="adminProductsList" class="space-y-3 max-h-64 overflow-y-auto pr-2">
            <!-- يتم تعبئتها تلقائياً -->
        </div>
    </div>

    <script>
        function checkLogin() {
            const pass = document.getElementById('adminPass').value;
            if (pass === '1234') {
                localStorage.setItem('is_admin_logged', 'true');
                showPanel();
            } else {
                alert('كلمة المرور غير صحيحة!');
            }
        }

        function showPanel() {
            document.getElementById('loginModal').classList.add('hidden');
            document.getElementById('adminPanel').classList.remove('hidden');
            loadAdminProducts();
        }

        function logout() {
            localStorage.removeItem('is_admin_logged');
            location.reload();
        }

        if (localStorage.getItem('is_admin_logged') === 'true') {
            showPanel();
        }

        function addProduct(e) {
            e.preventDefault();
            const newProduct = {
                id: Date.now(),
                name: document.getElementById('pName').value,
                price: document.getElementById('pPrice').value,
                category: document.getElementById('pCategory').value,
                image: document.getElementById('pImage').value,
                desc: document.getElementById('pDesc').value
            };

            let products = JSON.parse(localStorage.getItem('cloud_products') || '[]');
            products.unshift(newProduct);
            localStorage.setItem('cloud_products', JSON.stringify(products));

            document.getElementById('productForm').reset();
            loadAdminProducts();
            alert('تم نشر المنتج بنجاح وتحديث الصفحة الرئيسية فوراً!');
        }

        function deleteProduct(id) {
            let products = JSON.parse(localStorage.getItem('cloud_products') || '[]');
            products = products.filter(p => p.id !== id);
            localStorage.setItem('cloud_products', JSON.stringify(products));
            loadAdminProducts();
        }

        function loadAdminProducts() {
            const list = document.getElementById('adminProductsList');
            const products = JSON.parse(localStorage.getItem('cloud_products') || '[]');
            list.innerHTML = '';

            if (products.length === 0) {
                list.innerHTML = `<p class="text-neutral-500 text-center py-4">لا توجد منتجات مسجلة حالياً.</p>`;
                return;
            }

            products.forEach(p => {
                list.innerHTML += `
                    <div class="bg-neutral-950 border border-amber-900/30 p-4 rounded-xl flex justify-between items-center">
                        <div class="flex items-center gap-3">
                            <img src="${p.image}" class="w-12 h-12 rounded-lg object-cover">
                            <div>
                                <h4 class="font-bold text-white text-sm">${p.name}</h4>
                                <span class="text-xs text-amber-400">${p.category} | ${p.price} ر.س</span>
                            </div>
                        </div>
                        <button onclick="deleteProduct(${p.id})" class="bg-red-500/10 text-red-400 px-3 py-1.5 rounded-lg text-xs hover:bg-red-600 hover:text-white transition">حذف</button>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
