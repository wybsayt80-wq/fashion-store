<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم العالمية - كيان جينز</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0b0b; color: #fff; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: #141414; padding: 35px; border-radius: 14px; border: 1px solid #222; box-shadow: 0 10px 30px rgba(0,0,0,0.7); }
        h1, h2 { color: #d4af37; margin-bottom: 20px; border-bottom: 2px solid #222; padding-bottom: 10px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; color: #ccc; font-weight: 500; }
        input, select, textarea { width: 100%; padding: 12px; background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 6px; font-size: 15px; }
        input[type="file"] { background: #222; cursor: pointer; padding: 10px; border: 2px dashed #444; }
        button { background: #d4af37; color: #000; border: none; padding: 12px 25px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.3s; margin-top: 10px; font-size: 16px; }
        button:hover { background: #b8972b; transform: translateY(-2px); }
        .back-link { display: inline-block; margin-bottom: 25px; color: #d4af37; text-decoration: none; font-weight: bold; }
        .section-box { margin-bottom: 45px; background: #181818; padding: 25px; border-radius: 10px; border: 1px solid #282828; }
        table { width: 100%; margin-top: 20px; border-collapse: collapse; }
        th, td { padding: 12px; border-bottom: 1px solid #333; text-align: right; font-size: 14px; }
        th { color: #d4af37; }
        .action-btns { display: flex; gap: 8px; }
        .edit-btn { background: #3377cc; color: #fff; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; }
        .del-btn { background: #cc3333; color: #fff; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; }
        .preview-imgs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
        .preview-imgs img { width: 70px; height: 70px; object-fit: cover; border-radius: 6px; border: 1px solid #d4af37; }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="back-link">← العودة إلى المتجر الرئيسي</a>
        <h1>لوحة التحكم المباشرة - كيان جينز</h1>

        <!-- 1. إعدادات الشعار الثابت -->
        <div class="section-box">
            <h2>إعدادات الشعار الرئيسي للمتجر</h2>
            <div class="form-group">
                <label>اسم المتجر:</label>
                <input type="text" id="setting-storeName" value="كيان جينز">
            </div>
            <div class="form-group">
                <label>العنوان الرئيسي:</label>
                <input type="text" id="setting-heroTitle">
            </div>
            <div class="form-group">
                <label>الوصف الترويجي:</label>
                <textarea id="setting-heroSubtitle" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label>اختر صورة الشعار الثابت (من استوديو الموبايل أو ملفات اللابتوب):</label>
                <input type="file" id="setting-animatedLogoFile" accept="image/*" onchange="convertLogoFile(this)">
                <div class="preview-imgs" id="logo-preview"></div>
            </div>
            <button onclick="saveSettings()">حفظ الشعار والإعدادات</button>
        </div>

        <!-- 2. إدارة شريط العروض المميزة ورفع صورها -->
        <div class="section-box">
            <h2>إدارة شريط العروض المميزة في قمة الشاشة</h2>
            <div class="form-group">
                <label>تفعيل الشريط:</label>
                <select id="setting-promoActive">
                    <option value="true">مفعل (يظهر في القمة)</option>
                    <option value="false">مخفي</option>
                </select>
            </div>
            <div class="form-group">
                <label>نص العرض:</label>
                <input type="text" id="setting-promoText" value="🔥 خصم حصري لفترة محدودة!">
            </div>
            <div class="form-group">
                <label>وقت انتهاء العرض:</label>
                <input type="datetime-local" id="setting-promoEndTime">
            </div>
            <div class="form-group">
                <label>اختر صور العرض (يمكنك اختيار عدة صور دفعة واحدة من موبايلك):</label>
                <input type="file" id="setting-promoFiles" accept="image/*" multiple onchange="convertPromoFiles(this)">
                <div class="preview-imgs" id="promo-preview-container"></div>
            </div>
            <button onclick="savePromoSettings()">حفظ وتفعيل شريط العروض</button>
        </div>

        <!-- 3. إضافة منتج جديد (صيفي أو شتوي) -->
        <div class="section-box">
            <h2 id="form-heading">إضافة منتج جديد</h2>
            <input type="hidden" id="edit-product-id" value="">
            <div class="form-group">
                <label>اسم المنتج:</label>
                <input type="text" id="prod-name" placeholder="مثال: بنطلون جينز / جاكيت شتوي فاخر">
            </div>
            <div class="form-group">
                <label>السعر (بالجنيه المصري):</label>
                <input type="text" id="prod-price" placeholder="مثال: 550">
            </div>
            <div class="form-group">
                <label>القسم:</label>
                <select id="prod-category">
                    <option value="summer">قسم الصيف (بناطيل، قمصان، تيشرتات، خفيف)</option>
                    <option value="winter">قسم الشتاء (جواكت، سويتشيرتات، ثقيل)</option>
                </select>
            </div>
            <div class="form-group">
                <label>اختر صور المنتج (اختر حتى 10 صور مباشرة من استوديو موبايلك):</label>
                <input type="file" id="prod-files" accept="image/*" multiple onchange="convertProdFiles(this)">
                <div class="preview-imgs" id="prod-preview-container"></div>
            </div>
            <button onclick="saveProduct()" id="save-prod-btn">إضافة المنتج للمتجر</button>

            <h2>المنتجات الحالية</h2>
            <table>
                <thead>
                    <tr>
                        <th>اسم المنتج</th>
                        <th>السعر</th>
                        <th>القسم</th>
                        <th>إجراءات</th>
                    </tr>
                </thead>
                <tbody id="products-table-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        let tempPromoImages = [];
        let tempProdImages = [];
        let tempLogoUrl = "";

        window.addEventListener('DOMContentLoaded', () => {
            const settings = JSON.parse(localStorage.getItem('cloud_store_settings')) || {
                storeName: "كيان جينز",
                heroTitle: "ارتق بأناقتك مع تشكيلة رجالية فاخرة",
                heroSubtitle: "تسوق أحدث تشكيلات الملابس الصيفية والشتوية الكلاسيكية.",
                promoActive: false,
                promoText: "🔥 خصم حصري على كافة المنتجات لفترة محدودة!",
                promoImages: [],
                animatedLogoUrl: ""
            };

            document.getElementById('setting-storeName').value = settings.storeName;
            document.getElementById('setting-heroTitle').value = settings.heroTitle;
            document.getElementById('setting-heroSubtitle').value = settings.heroSubtitle;
            document.getElementById('setting-promoActive').value = settings.promoActive ? "true" : "false";
            document.getElementById('setting-promoText').value = settings.promoText;
            
            tempLogoUrl = settings.animatedLogoUrl || "";
            if(tempLogoUrl) {
                document.getElementById('logo-preview').innerHTML = `<img src="${tempLogoUrl}">`;
            }

            tempPromoImages = settings.promoImages || [];
            renderPreviews('promo-preview-container', tempPromoImages);

            renderProductsTable();
        });

        function convertLogoFile(input) {
            if(input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    tempLogoUrl = e.target.result;
                    document.getElementById('logo-preview').innerHTML = `<img src="${tempLogoUrl}">`;
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function convertPromoFiles(input) {
            tempPromoImages = [];
            const container = document.getElementById('promo-preview-container');
            container.innerHTML = '';
            Array.from(input.files).forEach(file => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    tempPromoImages.push(e.target.result);
                    container.innerHTML += `<img src="${e.target.result}">`;
                }
                reader.readAsDataURL(file);
            });
        }

        function convertProdFiles(input) {
            tempProdImages = [];
            const container = document.getElementById('prod-preview-container');
            container.innerHTML = '';
            Array.from(input.files).forEach(file => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    tempProdImages.push(e.target.result);
                    container.innerHTML += `<img src="${e.target.result}">`;
                }
                reader.readAsDataURL(file);
            });
        }

        function renderPreviews(containerId, imgsArray) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            imgsArray.forEach(img => {
                container.innerHTML += `<img src="${img}">`;
            });
        }

        function saveSettings() {
            const settings = JSON.parse(localStorage.getItem('cloud_store_settings')) || {};
            settings.storeName = document.getElementById('setting-storeName').value;
            settings.heroTitle = document.getElementById('setting-heroTitle').value;
            settings.heroSubtitle = document.getElementById('setting-heroSubtitle').value;
            settings.animatedLogoUrl = tempLogoUrl;
            
            localStorage.setItem('cloud_store_settings', JSON.stringify(settings));
            alert("تم حفظ الشعار والإعدادات بنجاح!");
        }

        function savePromoSettings() {
            const settings = JSON.parse(localStorage.getItem('cloud_store_settings')) || {};
            settings.promoActive = document.getElementById('setting-promoActive').value === "true";
            settings.promoText = document.getElementById('setting-promoText').value;
            settings.promoImages = tempPromoImages;
            
            const datetimeInput = document.getElementById('setting-promoEndTime').value;
            if (datetimeInput) {
                settings.promoEndTime = new Date(datetimeInput).getTime();
            }
            
            localStorage.setItem('cloud_store_settings', JSON.stringify(settings));
            alert("تم تحديث شريط العروض في قمة الشاشة بنجاح!");
        }

        function saveProduct() {
            const editId = document.getElementById('edit-product-id').value;
            const name = document.getElementById('prod-name').value;
            const price = document.getElementById('prod-price').value;
            const category = document.getElementById('prod-category').value;

            if (!name || !price) {
                alert("الرجاء إدخال اسم المنتج والسعر!");
                return;
            }

            let products = JSON.parse(localStorage.getItem('cloud_store_products')) || [];

            if (editId) {
                products = products.map(p => {
                    if (p.id == editId) {
                        return { 
                            id: Number(editId), 
                            name, 
                            price, 
                            category, 
                            imgs: tempProdImages.length > 0 ? tempProdImages : p.imgs 
                        };
                    }
                    return p;
                });
                document.getElementById('edit-product-id').value = '';
                document.getElementById('form-heading').innerText = "إضافة منتج جديد";
                document.getElementById('save-prod-btn').innerText = "إضافة المنتج للمتجر";
            } else {
                products.push({ id: Date.now(), name, price, category, imgs: tempProdImages });
            }

            localStorage.setItem('cloud_store_products', JSON.stringify(products));

            document.getElementById('prod-name').value = '';
            document.getElementById('prod-price').value = '';
            document.getElementById('prod-files').value = '';
            tempProdImages = [];
            document.getElementById('prod-preview-container').innerHTML = '';

            renderProductsTable();
            alert("تم حفظ ونشر المنتج بنجاح!");
        }

        function editProduct(id) {
            const products = JSON.parse(localStorage.getItem('cloud_store_products')) || [];
            const p = products.find(item => item.id == id);
            if (p) {
                document.getElementById('edit-product-id').value = p.id;
                document.getElementById('prod-name').value = p.name;
                document.getElementById('prod-price').value = p.price;
                document.getElementById('prod-category').value = p.category;
                tempProdImages = p.imgs || [];
                renderPreviews('prod-preview-container', tempProdImages);
                document.getElementById('form-heading').innerText = "تعديل المنتج الحالي";
                document.getElementById('save-prod-btn').innerText = "حفظ التعديلات";
                window.scrollTo({ top: document.getElementById('form-heading').offsetTop, behavior: 'smooth' });
            }
        }

        function deleteProduct(id) {
            let products = JSON.parse(localStorage.getItem('cloud_store_products')) || [];
            products = products.filter(p => p.id !== id);
            localStorage.setItem('cloud_store_products', JSON.stringify(products));
            renderProductsTable();
        }

        function renderProductsTable() {
            const products = JSON.parse(localStorage.getItem('cloud_store_products')) || [];
            const tbody = document.getElementById('products-table-body');
            tbody.innerHTML = '';

            products.forEach(p => {
                const catName = p.category === 'summer' ? 'صيفي' : 'شتوي';
                tbody.innerHTML += `
                    <tr>
                        <td>${p.name}</td>
                        <td>${p.price} ج.م</td>
                        <td>${catName}</td>
                        <td>
                            <div class="action-btns">
                                <button class="edit-btn" onclick="editProduct(${p.id})">تعديل</button>
                                <button class="del-btn" onclick="deleteProduct(${p.id})">حذف</button>
                            </div>
                        </td>
                    </tr>
                `;
            });
        }
    </script>
</body>
</html>
