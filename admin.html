<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الشاملة | المتجر الرجالي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #12100e; color: #f3f4f6; }
        .glass-card { background: rgba(26, 22, 18, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(212, 175, 55, 0.3); }
        .amber-gradient { background: linear-gradient(135deg, #d4af37 0%, #b8860b 100%); }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex justify-center">

    <!-- تسجيل الدخول -->
    <div id="loginModal" class="glass-card p-8 rounded-3xl w-full max-w-md shadow-2xl text-center self-center">
        <h2 class="text-2xl font-black text-amber-400 mb-2">تسجيل دخول الأدمن 🔐</h2>
        <p class="text-neutral-400 text-sm mb-6">كلمة المرور الافتراضية: 1234</p>
        <input type="password" id="adminPass" placeholder="كلمة المرور" class="w-full bg-neutral-950 border border-amber-900/40 rounded-xl px-4 py-3 text-white mb-4 text-center text-lg tracking-widest focus:outline-none focus:border-amber-500">
        <button onclick="checkLogin()" class="w-full amber-gradient text-black font-extrabold py-3 rounded-xl transition shadow-xl hover:opacity-90">دخول لوحة التحكم</button>
        <div class="mt-4"><a href="index.html" class="text-sm text-neutral-500 hover:text-amber-400">← العودة للموقع</a></div>
    </div>

    <!-- لوحة التحكم الكاملة -->
    <div id="adminPanel" class="hidden w-full max-w-5xl glass-card p-6 md:p-8 rounded-3xl shadow-2xl space-y-8">
        
        <div class="flex justify-between items-center pb-4 border-b border-amber-900/30">
            <h1 class="text-2xl font-black text-amber-400">⚡ لوحة التحكم الشاملة بالمتجر</h1>
            <div class="flex gap-3">
                <a href="index.html" target="_blank" class="bg-amber-500/10 text-amber-300 border border-amber-500/30 px-4 py-2 rounded-xl text-sm font-semibold hover:bg-amber-500 hover:text-black transition">عرض الموقع ↗</a>
                <button onclick="logout()" class="bg-red-500/10 text-red-400 border border-red-500/30 px-4 py-2 rounded-xl text-sm font-semibold hover:bg-red-600 hover:text-white transition">خروج</button>
            </div>
        </div>

        <!-- 1. إضافة منتج (مع رفع صور متعددة من الجهاز) -->
        <div class="bg-neutral-950/60 p-6 rounded-2xl border border-amber-900/30">
            <h3 class="text-lg font-bold text-amber-400 mb-4">📦 إضافة منتج رجالي جديد (رفع صور من الجهاز)</h3>
            <form id="productForm" onsubmit="addProduct(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm text-neutral-400 mb-1">اسم المنتج</label>
                    <input type="text" id="pName" required placeholder="مثال: بدلة كلاسيكية فاخرة" class="w-full bg-neutral-900 border border-amber-900/40 rounded-xl px-4 py-2.5 text-white">
                </div>
                <div>
                    <label class="block text-sm text-neutral-400 mb-1">القسم الرجالي</label>
                    <select id="pCategory" class="w-full bg-neutral-900 border border-amber-900/40 rounded-xl px-4 py-2.5 text-white">
                        <option value="classic">🧥 بدلات وكلاسيك</option>
                        <option value="pants">👖 بناطيل</option>
                        <option value="shoes">👟 كوتشيات وأحذية</option>
                    </select>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm text-neutral-400 mb-1">اختر الصور من جهازك (يمكنك اختيار عدة صور دفعة واحدة):</label>
                    <input type="file" id="pImageFiles" multiple accept="image/*" class="w-full bg-neutral-900 border border-amber-900/40 rounded-xl p-2.5 text-white file:bg-amber-500 file:text-black file:border-0 file:rounded-lg file:px-4 file:py-1 file:font-bold cursor-pointer">
                </div>
                <div>
                    <label class="block text-sm text-neutral-400 mb-1">السعر (ر.س)</label>
                    <input type="number" id="pPrice" placeholder="350" class="w-full bg-neutral-900 border border-amber-900/40 rounded-xl px-4 py-2.5 text-white">
                </div>
                <div class="flex items-center gap-3 pt-6">
                    <input type="checkbox" id="showPriceCheck" checked class="w-5 h-5 accent-amber-500">
                    <label for="showPriceCheck" class="text-sm text-white">إظهار السعر في الصفحة الرئيسية</label>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm text-neutral-400 mb-1">وصف المنتج</label>
                    <textarea id="pDesc" rows="2" placeholder="تفاصيل المقاسات والخامات..." class="w-full bg-neutral-900 border border-amber-900/40 rounded-xl px-4 py-2.5 text-white"></textarea>
                </div>
                <div class="md:col-span-2">
                    <button type="submit" class="w-full amber-gradient text-black font-extrabold py-3 rounded-xl transition shadow-xl hover:opacity-90">نشر المنتج فوراً في المتجر 🚀</button>
                </div>
            </form>
        </div>

        <!-- 2. العروض الموقوتة (مع رفع صورة العرض من الجهاز) -->
        <div class="bg-neutral-950/60 p-6 rounded-2xl border border-amber-900/30">
            <h3 class="text-lg font-bold text-amber-400 mb-4">🔥 إدارة العروض الموقوتة (بعداد تنازلي)</h3>
            <form onsubmit="saveOffer(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" id="offerTitle" required placeholder="عنوان العرض (مثال: خصم الجمعة الكبرى)" class="bg-neutral-900 border border-amber-900/40 rounded-xl px-4 py-2.5 text-white text-sm">
                <input type="number" id="offerPrice" required placeholder="سعر العرض (ر.س)" class="bg-neutral-900 border border-amber-900/40 rounded-xl px-4 py-2.5 text-white text-sm">
                <div class="md:col-span-2">
                    <label class="block text-xs text-neutral-400 mb-1">صورة العرض (اختر من الجهاز):</label>
                    <input type="file" id="offerImageFile" accept="image/*" class="w-full bg-neutral-900 border border-amber-900/40 rounded-xl p-2 text-white file:bg-amber-500 file:text-black file:border-0 file:rounded-lg file:px-3 file:py-1 file:font-bold cursor-pointer">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs text-neutral-400 mb-1">تاريخ ووقت انتهاء العرض:</label>
                    <input type="datetime-local" id="offerEndTime" required class="w-full bg-neutral-900 border border-amber-900/40 rounded-xl px-4 py-2.5 text-white text-sm">
                </div>
                <div class="md:col-span-2">
                    <button type="submit" class="w-full bg-amber-600 hover:bg-amber-500 text-black font-extrabold py-2.5 rounded-xl transition">تفعيل العرض في الصفحة الرئيسية</button>
                </div>
            </form>
        </div>

        <!-- 3. التحكم الكامل في العناوين والخطوط والألوان -->
        <div class="bg-neutral-950/60 p-6 rounded-2xl border border-amber-900/30">
            <h3 class="text-lg font-bold text-amber-400 mb-4">🎨 التحكم الكامل في العناوين، النصوص، الخطوط والألوان</h3>
            <form onsubmit="saveSettings(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs text-neutral-400 mb-1">اسم المتجر (في القائمة)</label>
                    <input type="text" id="settingBrand" class="w-full bg-neutral-900 border border-amber-900/40 rounded-xl px-4 py-2 text-white text-sm">
                </div>
                <div>
                    <label class="block text-xs text-neutral-400 mb-1">عنوان الصفحة</label>
                    <input type="text" id="settingTitle" class="w-full bg-neutral-900 border border-amber-900/40 rounded-xl px-4 py-2 text-white text-sm">
                </div>
                <div>
                    <label class="block text-xs text-neutral-400 mb-1">العنوان الفرعي (فوق الهيرو)</label>
                    <input type="text" id="settingHeroSub" class="w-full bg-neutral-900 border border-amber-900/40 rounded-xl px-4 py-2 text-white text-sm">
                </div>
                <div>
                    <label class="block text-xs text-neutral-400 mb-1">العنوان الرئيسي (الهيرو)</label>
                    <input type="text" id="settingHeroTitle" class="w-full bg-neutral-900 border border-amber-900/40 rounded-xl px-4 py-2 text-white text-sm">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs text-neutral-400 mb-1">وصف الهيرو</label>
                    <input type="text" id="settingHeroDesc" class="w-full bg-neutral-900 border border-amber-900/40 rounded-xl px-4 py-2 text-white text-sm">
                </div>
                <div>
                    <label class="block text-xs text-neutral-400 mb-1">عنوان قسم المنتجات</label>
                    <input type="text" id="settingGridTitle" class="w-full bg-neutral-900 border border-amber-900/40 rounded-xl px-4 py-2 text-white text-sm">
                </div>
                <div>
                    <label class="block text-xs text-neutral-400 mb-1">اسم القسم 1 (بدلات)</label>
                    <input type="text" id="settingCat1" class="w-full bg-neutral-900 border border-amber-900/40 rounded-xl px-4 py-2 text-white text-sm">
                </div>
                <div>
                    <label class="block text-xs text-neutral-400 mb-1">اسم القسم 2 (بناطيل)</label>
                    <input type="text" id="settingCat2" class="w-full bg-neutral-900 border border-amber-900/40 rounded-xl px-4 py-2 text-white text-sm">
                </div>
                <div>
                    <label class="block text-xs text-neutral-400 mb-1">اسم القسم 3 (أحذية)</label>
                    <input type="text" id="settingCat3" class="w-full bg-neutral-900 border border-amber-900/40 rounded-xl px-4 py-2 text-white text-sm">
                </div>
                <div>
                    <label class="block text-xs text-neutral-400 mb-1">لون الهوية الأساسي</label>
                    <input type="color" id="settingColor" value="#d4af37" class="w-full h-10 bg-neutral-900 border border-amber-900/40 rounded-xl px-2 cursor-pointer">
                </div>
                <div class="md:col-span-2">
                    <button type="submit" class="w-full amber-gradient text-black font-extrabold py-3 rounded-xl transition shadow-xl hover:opacity-90">حفظ وتطبيق إعدادات المتجر بالكامل 🌟</button>
                </div>
            </form>
        </div>

        <!-- إدارة المنتجات للحذف -->
        <h3 class="text-lg font-bold text-white mb-2">إدارة المنتجات المسجلة:</h3>
        <div id="adminProductsList" class="space-y-3 max-h-60 overflow-y-auto pr-2"></div>

    </div>

    <script>
        function checkLogin() {
            if (document.getElementById('adminPass').value === '1234') {
                localStorage.setItem('is_admin_logged', 'true');
                showPanel();
            } else { alert('كلمة المرور خطأ!'); }
        }
        function showPanel() {
            document.getElementById('loginModal').classList.add('hidden');
            document.getElementById('adminPanel').classList.remove('hidden');
            loadAdminData();
            loadSettingsToForm();
        }
        function logout() { localStorage.removeItem('is_admin_logged'); location.reload(); }
        if (localStorage.getItem('is_admin_logged') === 'true') { showPanel(); }

        // تحويل الملفات المرفوعة إلى Base64 لضمان حفظها محلياً وعرضها فوراً
        async function convertFilesToBasePath(fileInput) {
            const files = fileInput.files;
            const promises = [];
            for (let i = 0; i < files.length; i++) {
                promises.push(new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result);
                    reader.readAsDataURL(files[i]);
                }));
            }
            return await Promise.all(promises);
        }

        async function addProduct(e) {
            e.preventDefault();
            const fileInput = document.getElementById('pImageFiles');
            const imagesBase64 = await convertFilesToBasePath(fileInput);

            const newProduct = {
                id: Date.now(),
                name: document.getElementById('pName').value,
                category: document.getElementById('pCategory').value,
                images: imagesBase64,
                price: document.getElementById('pPrice').value,
                showPrice: document.getElementById('showPriceCheck').checked,
                desc: document.getElementById('pDesc').value
            };

            let products = JSON.parse(localStorage.getItem('cloud_products') || '[]');
            products.unshift(newProduct);
            localStorage.setItem('cloud_products', JSON.stringify(products));
            document.getElementById('productForm').reset();
            loadAdminData();
            alert('تم رفع الصور ونشر المنتج في المتجر بنجاح!');
        }

        async function saveOffer(e) {
            e.preventDefault();
            const fileInput = document.getElementById('offerImageFile');
            const imagesBase64 = await convertFilesToBasePath(fileInput);

            const offer = {
                title: document.getElementById('offerTitle').value,
                price: document.getElementById('offerPrice').value,
                image: imagesBase64[0] || '',
                endTime: document.getElementById('offerEndTime').value
            };
            localStorage.setItem('store_offer', JSON.stringify(offer));
            alert('تم رفع صورة العرض وتفعيله في الصفحة الرئيسية بنجاح!');
        }

        function saveSettings(e) {
            e.preventDefault();
            const settings = {
                siteName: document.getElementById('settingBrand').value,
                siteTitle: document.getElementById('settingTitle').value,
                heroSubtitle: document.getElementById('settingHeroSub').value,
                heroTitle: document.getElementById('settingHeroTitle').value,
                heroDesc: document.getElementById('settingHeroDesc').value,
                sectionGridTitle: document.getElementById('settingGridTitle').value,
                cat1: document.getElementById('settingCat1').value,
                cat2: document.getElementById('settingCat2').value,
                cat3: document.getElementById('settingCat3').value,
                primaryColor: document.getElementById('settingColor').value
            };
            localStorage.setItem('store_settings', JSON.stringify(settings));
            alert('تم حفظ إعدادات وتصميم المتجر بالكامل بنجاح!');
        }

        function loadSettingsToForm() {
            const s = JSON.parse(localStorage.getItem('store_settings') || '{}');
            if(s.siteName) document.getElementById('settingBrand').value = s.siteName;
            if(s.siteTitle) document.getElementById('settingTitle').value = s.siteTitle;
            if(s.heroSubtitle) document.getElementById('settingHeroSub').value = s.heroSubtitle;
            if(s.heroTitle) document.getElementById('settingHeroTitle').value = s.heroTitle;
            if(s.heroDesc) document.getElementById('settingHeroDesc').value = s.heroDesc;
            if(s.sectionGridTitle) document.getElementById('settingGridTitle').value = s.sectionGridTitle;
            if(s.cat1) document.getElementById('settingCat1').value = s.cat1;
            if(s.cat2) document.getElementById('settingCat2').value = s.cat2;
            if(s.cat3) document.getElementById('settingCat3').value = s.cat3;
            if(s.primaryColor) document.getElementById('settingColor').value = s.primaryColor;
        }

        function deleteProduct(id) {
            let products = JSON.parse(localStorage.getItem('cloud_products') || '[]');
            products = products.filter(p => p.id !== id);
            localStorage.setItem('cloud_products', JSON.stringify(products));
            loadAdminData();
        }

        function loadAdminData() {
            const list = document.getElementById('adminProductsList');
            const products = JSON.parse(localStorage.getItem('cloud_products') || '[]');
            list.innerHTML = '';
            if(products.length === 0) {
                list.innerHTML = `<p class="text-neutral-500 text-center py-4">لا توجد منتجات مسجلة.</p>`;
                return;
            }
            products.forEach(p => {
                list.innerHTML += `
                    <div class="bg-neutral-900 border border-amber-900/30 p-4 rounded-xl flex justify-between items-center">
                        <div class="flex items-center gap-3">
                            <img src="${p.images && p.images[0] ? p.images[0] : ''}" class="w-12 h-12 rounded-lg object-cover">
                            <div>
                                <h4 class="font-bold text-white text-sm">${p.name}</h4>
                                <span class="text-xs text-amber-400">${p.category} | ${p.price || 'بدون سعر'} ر.س</span>
                            </div>
                        </div>
                        <button onclick="deleteProduct(${p.id})" class="bg-red-500/10 text-red-400 px-3 py-1.5 rounded-lg text-xs hover:bg-red-600 hover:text-white transition">حذف</button>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
