<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الشاملة - إدارة المتجر</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0b0b; color: #fff; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: #141414; padding: 30px; border-radius: 12px; border: 1px solid #222; }
        h1, h2 { color: #d4af37; margin-bottom: 20px; border-bottom: 2px solid #222; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #ccc; }
        input, select, textarea { width: 100%; padding: 10px; background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 6px; }
        button { background: #d4af37; color: #000; border: none; padding: 12px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        button:hover { background: #b8972b; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #d4af37; text-decoration: none; }
        .section-box { margin-bottom: 40px; background: #181818; padding: 20px; border-radius: 8px; border: 1px solid #282828; }
        table { width: 100%; margin-top: 15px; border-collapse: collapse; }
        th, td { padding: 10px; border-bottom: 1px solid #333; text-align: right; font-size: 14px; }
        th { color: #d4af37; }
        .del-btn { background: #cc3333; color: #fff; padding: 5px 10px; border: none; border-radius: 4px; cursor: pointer; }
        .del-btn:hover { background: #aa2222; }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="back-link">← العودة إلى المتجر الرئيسي</a>
        <h1>لوحة التحكم الشاملة للمتجر</h1>

        <!-- 1. إعدادات النصوص والعناوين -->
        <div class="section-box">
            <h2>تعديل العناوين والنصوص والترويسة</h2>
            <div class="form-group">
                <label>اسم المتجر:</label>
                <input type="text" id="setting-storeName">
            </div>
            <div class="form-group">
                <label>العنوان الرئيسي (Hero Title):</label>
                <input type="text" id="setting-heroTitle">
            </div>
            <div class="form-group">
                <label>الوصف الترويجي:</label>
                <textarea id="setting-heroSubtitle" rows="3"></textarea>
            </div>
            <button onclick="saveSettings()">حفظ العناوين والنصوص</button>
        </div>

        <!-- 2. إعدادات العرض العلوي والوقت -->
        <div class="section-box">
            <h2>إدارة شريط العروض والتوقيت المباشر</h2>
            <div class="form-group">
                <label>تفعيل شريط العرض العلوي:</label>
                <select id="setting-promoActive">
                    <option value="true">مفعل (يظهر فوق)</option>
                    <option value="false">مخفي</option>
                </select>
            </div>
            <div class="form-group">
                <label>نص العرض:</label>
                <input type="text" id="setting-promoText">
            </div>
            <div class="form-group">
                <label>تاريخ ووقت انتهاء العرض (اختر الوقت المستهدف):</label>
                <input type="datetime-local" id="setting-promoEndTime">
            </div>
            <button onclick="savePromoSettings()">حفظ إعدادات العرض</button>
        </div>

        <!-- 3. إدارة المنتجات والأقسام -->
        <div class="section-box">
            <h2>إضافة منتج جديد</h2>
            <div class="form-group">
                <label>اسم المنتج:</label>
                <input type="text" id="prod-name" placeholder="مثال: بدلة كلاسيكية سوداء">
            </div>
            <div class="form-group">
                <label>السعر:</label>
                <input type="text" id="prod-price" placeholder="مثال: 1200 ج.م">
            </div>
            <div class="form-group">
                <label>القسم:</label>
                <select id="prod-category">
                    <option value="suits">بدلات وكلاسيك</option>
                    <option value="pants">بناطل</option>
                    <option value="shoes">كوتشيات وأحذية</option>
                </select>
            </div>
            <div class="form-group">
                <label>رابط صورة المنتج (URL):</label>
                <input type="text" id="prod-img" placeholder="ضع رابط الصورة هنا">
            </div>
            <button onclick="addProduct()">إضافة المنتج للمتجر</button>

            <h2>المنتجات الحالية</h2>
            <table>
                <thead>
                    <tr>
                        <th>اسم المنتج</th>
                        <th>السعر</th>
                        <th>القسم</th>
                        <th>إجراء</th>
                    </tr>
                </span>
                <tbody id="products-table-body">
                    <!-- تعبئة المنتجات تلقائياً -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // تحميل البيانات الحالية عند فتح لوحة التحكم
        window.addEventListener('DOMContentLoaded', () => {
            const settings = JSON.parse(localStorage.getItem('store_settings')) || {
                storeName: "MEN'S LUXURY",
                heroTitle: "ارتق بأناقتك مع تشكيلة رجالية فاخرة",
                heroSubtitle: "تسوق أحدث صيحات الموضة الرجالية الكلاسيكية...",
                promoActive: true,
                promoText: "🔥 خصم حصري على كافة المنتجات لفترة محدودة!"
            };

            document.getElementById('setting-storeName').value = settings.storeName;
            document.getElementById('setting-heroTitle').value = settings.heroTitle;
            document.getElementById('setting-heroSubtitle').value = settings.heroSubtitle;
            document.getElementById('setting-promoActive').value = settings.promoActive ? "true" : "false";
            document.getElementById('setting-promoText').value = settings.promoText;

            renderProductsTable();
        });

        function saveSettings() {
            const settings = JSON.parse(localStorage.getItem('store_settings')) || {};
            settings.storeName = document.getElementById('setting-storeName').value;
            settings.heroTitle = document.getElementById('setting-heroTitle').value;
            settings.heroSubtitle = document.getElementById('setting-heroSubtitle').value;
            localStorage.setItem('store_settings', JSON.stringify(settings));
            alert("تم حفظ العناوين بنجاح! اذهب للمتجر لرؤية التغييرات.");
        }

        function savePromoSettings() {
            const settings = JSON.parse(localStorage.getItem('store_settings')) || {};
            settings.promoActive = document.getElementById('setting-promoActive').value === "true";
            settings.promoText = document.getElementById('setting-promoText').value;
            
            const datetimeInput = document.getElementById('setting-promoEndTime').value;
            if (datetimeInput) {
                settings.promoEndTime = new Date(datetimeInput).getTime();
            } else {
                settings.promoEndTime = new Date().getTime() + (24 * 60 * 60 * 1000);
            }

            localStorage.setItem('store_settings', JSON.stringify(settings));
            alert("تم تحديث شريط العروض والوقت بنجاح!");
        }

        function addProduct() {
            const name = document.getElementById('prod-name').value;
            const price = document.getElementById('prod-price').value;
            const category = document.getElementById('prod-category').value;
            const img = document.getElementById('prod-img').value;

            if (!name || !price || !img) {
                alert("الرجاء ملء جميع بيانات المنتج!");
                return;
            }

            const products = JSON.parse(localStorage.getItem('store_products')) || [];
            products.push({ id: Date.now(), name, price, category, img });
            localStorage.setItem('store_products', JSON.stringify(products));

            document.getElementById('prod-name').value = '';
            document.getElementById('prod-price').value = '';
            document.getElementById('prod-img').value = '';

            renderProductsTable();
            alert("تم إضافة المنتج بنجاح!");
        }

        function deleteProduct(id) {
            let products = JSON.parse(localStorage.getItem('store_products')) || [];
            products = products.filter(p => p.id !== id);
            localStorage.setItem('store_products', JSON.stringify(products));
            renderProductsTable();
        }

        function renderProductsTable() {
            const products = JSON.parse(localStorage.getItem('store_products')) || [];
            const tbody = document.getElementById('products-table-body');
            tbody.innerHTML = '';

            products.forEach(p => {
                tbody.innerHTML += `
                    <tr>
                        <td>${p.name}</td>
                        <td>${p.price}</td>
                        <td>${p.category}</td>
                        <td><button class="del-btn" onclick="deleteProduct(${p.id})">حذف</button></td>
                    </tr>
                `;
            });
        }
    </script>
</body>
</html>
